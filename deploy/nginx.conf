server {
    listen 80;
    listen [::]:80;
    server_name skills.itops.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/skills.itops.dev/acme;
        try_files $uri =404;
    }
    location / { return 308 https://skills.itops.dev$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skills.itops.dev;
    root /var/www/skills.itops.dev/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/skills.itops.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skills.itops.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    autoindex off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;

    # Original source is always inert, including .html, .svg and .js files.
    # Keep server header inheritance: do not add location-level headers.
    location ^~ /files/ {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }
    location ^~ /downloads/ {
        types { application/zip zip; }
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
